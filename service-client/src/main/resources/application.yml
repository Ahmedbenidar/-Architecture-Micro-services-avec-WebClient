server:
  port: 8081

spring:
  application:
    name: SERVICE-CLIENT
  datasource:
    # Le lab utilise MySQL (jdbc:mysql://localhost:3306/clientservicedb) : ecart documente dans le README
    url: jdbc:h2:mem:clientservicedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
